org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.logging.stacktrace=full
org.gradle.configuration-cache=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true

# Robustness: enable persistent daemon so the build worker survives even if the
# gradle client launcher is killed by the sandbox watchdog (build continues in the
# detached daemon and writes the APK). Parallelism limited to keep memory bounded.
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
